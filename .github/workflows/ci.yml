name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCOPEGUARD_TAG: v0.4.0
  ARCHIGUARD_TAG: v0.1.0

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: sibling checkouts for the integration tests
        shell: bash
        run: |
          git clone -q --depth 1 --branch "$SCOPEGUARD_TAG" https://github.com/rlgdev/spec-kit-scopeguard "$RUNNER_TEMP/scopeguard"
          git clone -q --depth 1 --branch "$ARCHIGUARD_TAG" https://github.com/rlgdev/spec-kit-archiguard "$RUNNER_TEMP/archiguard"
      - name: pytest
        shell: bash
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          SCOPEGUARD_SRC="$RUNNER_TEMP/scopeguard" ARCHIGUARD_SRC="$RUNNER_TEMP/archiguard" python -m pytest -q -rs --junitxml=pytest-report.xml
      - name: failing tests as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("pytest-report.xml").getroot().iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  text = ((bad.get("message") or "") + "\n" + (bad.text or ""))[-3000:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY

  viewer:
    name: viewer smoke test (Chromium, file://, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest playwright && python -m playwright install --with-deps chromium
      - run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          python -m pytest -q tests/test_views.py -k "viewer" -rs

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pyflakes
      - run: python -m pyflakes scripts/python tools tests
      - run: shellcheck scripts/bash/auditguard.sh tools/e2e-speckit.sh
      - run: python tools/build.py --check

  launchers:
    name: launchers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: bash launcher on the example
        shell: bash
        working-directory: examples/orders
        run: |
          bash ../../scripts/bash/auditguard.sh verify --no-render
          bash ../../scripts/bash/auditguard.sh show --all > /dev/null
          bash ../../scripts/bash/auditguard.sh check | tee check.txt
          grep -q "no_changes_after_signoff" check.txt
      - name: PowerShell launcher on the example
        shell: pwsh
        working-directory: examples/orders
        run: |
          & ../../scripts/powershell/auditguard.ps1 verify --no-render
          if ($LASTEXITCODE -ne 0) { throw "verify failed with $LASTEXITCODE" }
          & ../../scripts/powershell/auditguard.ps1 version
          if ($LASTEXITCODE -ne 0) { throw "version failed with $LASTEXITCODE" }
          exit 0

  spec-kit:
    name: install into Spec Kit (${{ matrix.speckit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        speckit: ["specify-cli", "specify-cli==1.0.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "${{ matrix.speckit }}"
      - run: bash tools/e2e-speckit.sh

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: verify the example (passes)
        uses: ./
        with:
          working-directory: examples/orders
          command: verify
      - name: tamper with a journal line
        run: sed -i '3s/"seq": 3/"seq": 33/' examples/orders/audit/sprints/S-2026-21/001-place-order/journal.jsonl
      - name: verify again (must fail)
        id: tampered
        continue-on-error: true
        uses: ./
        with:
          working-directory: examples/orders
          command: verify
      - run: test "${{ steps.tampered.outcome }}" = "failure"
