schema_version: "1.0"

extension:
  id: auditguard
  name: "auditGuard"
  version: "0.1.0"
  description: "Tamper-evident audit trail of the Spec Kit SDLC: every command by stage, the gate reports of scopeGuard and archiGuard, the waiver history, human decisions and changes outside recorded commands, per sprint and feature, verifiable against git and the other golden sources"
  author: "rlgdev"
  repository: https://github.com/rlgdev/spec-kit-auditguard
  homepage: https://github.com/rlgdev/spec-kit-auditguard
  license: MIT
  category: process
  effect: read-write

requires:
  # 1.0.1: before_/after_ hooks on all commands and the agent-native runtime events (sessions, stop, the guard)
  speckit_version: ">=1.0.1"
  # informational: as of Spec Kit 1.1.1 the CLI reads only requires.speckit_version from this manifest (extension add,
  # compatibility and `extension info` of a local install ignore `tools`; info lists tools only from a catalog entry).
  # The launchers find python themselves; git is used when present.
  tools:
    - name: python
      version: ">=3.9"
      required: false
      description: "Runs the recorder (standard library only). Without python on PATH the launchers use the Python bundled with specify-cli, or uv."
    - name: git
      version: ">=2.20"
      required: false
      description: "Commits, code changes, golden-source verification and anchoring. Recording works without it."

provides:
  commands:
    # generated by tools/build.py from templates/hook-command.md - one entry and one exit command per Spec Kit command
    - name: speckit.auditguard.specifyentry
      file: commands/speckit.auditguard.specifyentry.md
      description: "(hook) record the start of /speckit.specify"
    - name: speckit.auditguard.specifyexit
      file: commands/speckit.auditguard.specifyexit.md
      description: "(hook) record the end of /speckit.specify"
    - name: speckit.auditguard.clarifyentry
      file: commands/speckit.auditguard.clarifyentry.md
      description: "(hook) record the start of /speckit.clarify"
    - name: speckit.auditguard.clarifyexit
      file: commands/speckit.auditguard.clarifyexit.md
      description: "(hook) record the end of /speckit.clarify"
    - name: speckit.auditguard.planentry
      file: commands/speckit.auditguard.planentry.md
      description: "(hook) record the start of /speckit.plan"
    - name: speckit.auditguard.planexit
      file: commands/speckit.auditguard.planexit.md
      description: "(hook) record the end of /speckit.plan: changes, outcome, gate reports, waiver changes"
    - name: speckit.auditguard.tasksentry
      file: commands/speckit.auditguard.tasksentry.md
      description: "(hook) record the start of /speckit.tasks"
    - name: speckit.auditguard.tasksexit
      file: commands/speckit.auditguard.tasksexit.md
      description: "(hook) record the end of /speckit.tasks"
    - name: speckit.auditguard.analyzeentry
      file: commands/speckit.auditguard.analyzeentry.md
      description: "(hook) record the start of /speckit.analyze"
    - name: speckit.auditguard.analyzeexit
      file: commands/speckit.auditguard.analyzeexit.md
      description: "(hook) record the end of /speckit.analyze"
    - name: speckit.auditguard.checklistentry
      file: commands/speckit.auditguard.checklistentry.md
      description: "(hook) record the start of /speckit.checklist"
    - name: speckit.auditguard.checklistexit
      file: commands/speckit.auditguard.checklistexit.md
      description: "(hook) record the end of /speckit.checklist"
    - name: speckit.auditguard.constitutionentry
      file: commands/speckit.auditguard.constitutionentry.md
      description: "(hook) record the start of /speckit.constitution (project journal)"
    - name: speckit.auditguard.constitutionexit
      file: commands/speckit.auditguard.constitutionexit.md
      description: "(hook) record the end of /speckit.constitution"
    - name: speckit.auditguard.convergeentry
      file: commands/speckit.auditguard.convergeentry.md
      description: "(hook) record the start of /speckit.converge"
    - name: speckit.auditguard.convergeexit
      file: commands/speckit.auditguard.convergeexit.md
      description: "(hook) record the end of /speckit.converge"
    - name: speckit.auditguard.implemententry
      file: commands/speckit.auditguard.implemententry.md
      description: "(hook) record the start of /speckit.implement (enters the implement stage)"
    - name: speckit.auditguard.implementexit
      file: commands/speckit.auditguard.implementexit.md
      description: "(hook) record the end of /speckit.implement"
    - name: speckit.auditguard.taskstoissuesentry
      file: commands/speckit.auditguard.taskstoissuesentry.md
      description: "(hook) record the start of /speckit.taskstoissues"
    - name: speckit.auditguard.taskstoissuesexit
      file: commands/speckit.auditguard.taskstoissuesexit.md
      description: "(hook) record the end of /speckit.taskstoissues"
    # for people and agents
    - name: speckit.auditguard.trail
      file: commands/speckit.auditguard.trail.md
      description: "Show the current feature's audit trail for this sprint, with the open items"
    - name: speckit.auditguard.collect
      file: commands/speckit.auditguard.collect.md
      description: "Collect new evidence of scopeGuard, archiGuard, the ledger and workflow runs into the trail now"
    - name: speckit.auditguard.verify
      file: commands/speckit.auditguard.verify.md
      description: "Verify every chain, seal and evidence hash, and the trail against git and the other golden sources"
    - name: speckit.auditguard.configure
      file: commands/speckit.auditguard.configure.md
      description: "Apply auditguard-config.yml to Spec Kit's hooks and show what is in force"
    # agent runtime events (wired by Spec Kit; the dispatcher does not pass the event name, so one command per event)
    - name: speckit.auditguard.sessionstart
      file: commands/speckit.auditguard.sessionstart.md
      description: "(agent event) record the start of an agent session"
    - name: speckit.auditguard.stop
      file: commands/speckit.auditguard.stop.md
      description: "(agent event) end of an agent turn: close a command that escalated without its after_ hook"
    - name: speckit.auditguard.sessionend
      file: commands/speckit.auditguard.sessionend.md
      description: "(agent event) record the end of an agent session and close open commands"
    - name: speckit.auditguard.guard
      file: commands/speckit.auditguard.guard.md
      description: "(agent event) block agent edits of the audit trail and the auditGuard commands reserved for people"

  config:
    - name: "auditguard-config.yml"
      template: "config-template.yml"
      description: "auditGuard settings: integration, mode, audit folder, stages, collectors, golden sources, rules, guard, viewer"
      required: false

hooks:
  before_specify:
    command: speckit.auditguard.specifyentry
    optional: false
    description: "auditGuard: record the start of /speckit.specify"
  after_specify:
    command: speckit.auditguard.specifyexit
    optional: false
    description: "auditGuard: record the end of /speckit.specify"
  before_clarify:
    command: speckit.auditguard.clarifyentry
    optional: false
    description: "auditGuard: record the start of /speckit.clarify"
  after_clarify:
    command: speckit.auditguard.clarifyexit
    optional: false
    description: "auditGuard: record the end of /speckit.clarify"
  before_plan:
    command: speckit.auditguard.planentry
    optional: false
    description: "auditGuard: record the start of /speckit.plan"
  after_plan:
    command: speckit.auditguard.planexit
    optional: false
    description: "auditGuard: record the end of /speckit.plan"
  before_tasks:
    command: speckit.auditguard.tasksentry
    optional: false
    description: "auditGuard: record the start of /speckit.tasks"
  after_tasks:
    command: speckit.auditguard.tasksexit
    optional: false
    description: "auditGuard: record the end of /speckit.tasks"
  before_analyze:
    command: speckit.auditguard.analyzeentry
    optional: false
    description: "auditGuard: record the start of /speckit.analyze"
  after_analyze:
    command: speckit.auditguard.analyzeexit
    optional: false
    description: "auditGuard: record the end of /speckit.analyze"
  before_checklist:
    command: speckit.auditguard.checklistentry
    optional: false
    description: "auditGuard: record the start of /speckit.checklist"
  after_checklist:
    command: speckit.auditguard.checklistexit
    optional: false
    description: "auditGuard: record the end of /speckit.checklist"
  before_constitution:
    command: speckit.auditguard.constitutionentry
    optional: false
    description: "auditGuard: record the start of /speckit.constitution"
  after_constitution:
    command: speckit.auditguard.constitutionexit
    optional: false
    description: "auditGuard: record the end of /speckit.constitution"
  before_converge:
    command: speckit.auditguard.convergeentry
    optional: false
    description: "auditGuard: record the start of /speckit.converge"
  after_converge:
    command: speckit.auditguard.convergeexit
    optional: false
    description: "auditGuard: record the end of /speckit.converge"
  before_implement:
    command: speckit.auditguard.implemententry
    optional: false
    description: "auditGuard: record the start of /speckit.implement"
  after_implement:
    command: speckit.auditguard.implementexit
    optional: false
    description: "auditGuard: record the end of /speckit.implement"
  before_taskstoissues:
    command: speckit.auditguard.taskstoissuesentry
    optional: false
    description: "auditGuard: record the start of /speckit.taskstoissues"
  after_taskstoissues:
    command: speckit.auditguard.taskstoissuesexit
    optional: false
    description: "auditGuard: record the end of /speckit.taskstoissues"

events:
  session_start:
    command: speckit.auditguard.sessionstart
    timeout: 15
  stop:
    command: speckit.auditguard.stop
    timeout: 30
  session_end:
    command: speckit.auditguard.sessionend
    timeout: 30
  pre_tool_use:
    command: speckit.auditguard.guard
    matcher: "Edit|Write|MultiEdit|NotebookEdit|Bash|PowerShell"
    timeout: 10

tags:
  - "audit"
  - "traceability"
  - "governance"
  - "compliance"
  - "human-in-the-loop"
